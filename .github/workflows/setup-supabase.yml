name: Setup Supabase Database

# Manually-triggered, one-time setup: runs the schema migration and seeds
# the initial price list / expense categories against a real Supabase
# project. Takes the database connection URI and the login email as
# run-time inputs (rather than a stored repo secret) so it can be
# triggered without needing repo Settings/Secrets access.

on:
  workflow_dispatch:
    inputs:
      login_email:
        description: "האימייל של המשתמשת שיצרת ב-Supabase (Authentication -> Users)"
        required: true
        type: string
      db_url:
        description: "Connection string (Session pooler, URI) מתוך Supabase Database Settings"
        required: true
        type: string
      sync_pin:
        description: "קוד סנכרון (מספרים/אותיות בלבד, בלי מרכאות) - את תזיני אותו פעם אחת בכל מכשיר. השאירי ריק אם כבר הגדרת קוד קודם ורק רוצה להריץ מיגרציות אחרות."
        required: false
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mask sensitive input
        run: |
          echo "::add-mask::${{ inputs.db_url }}"
          echo "::add-mask::${{ inputs.sync_pin }}"

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Run schema migration (0001_init.sql)
        run: |
          set -euo pipefail
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f supabase/migrations/0001_init.sql
        env:
          DB_URL: ${{ inputs.db_url }}

      - name: Seed treatments and expense categories (0002_seed_treatments.sql)
        run: |
          set -euo pipefail
          sed "s|REPLACE_WITH_LOGIN_EMAIL|${LOGIN_EMAIL}|" \
            supabase/migrations/0002_seed_treatments.sql > /tmp/seed.sql
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/seed.sql
        env:
          DB_URL: ${{ inputs.db_url }}
          LOGIN_EMAIL: ${{ inputs.login_email }}

      - name: Pivot to treatment-tracking only (0003_pivot_treatment_tracking.sql)
        run: |
          set -euo pipefail
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f supabase/migrations/0003_pivot_treatment_tracking.sql
        env:
          DB_URL: ${{ inputs.db_url }}

      - name: Add payment method to product sales (0004_product_sales_payment_method.sql)
        run: |
          set -euo pipefail
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f supabase/migrations/0004_product_sales_payment_method.sql
        env:
          DB_URL: ${{ inputs.db_url }}

      - name: Add cross-device sync table (0005_sync_blob.sql)
        run: |
          set -euo pipefail
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f supabase/migrations/0005_sync_blob.sql
        env:
          DB_URL: ${{ inputs.db_url }}

      - name: Require a PIN for sync access (0006_sync_pin.sql)
        if: ${{ inputs.sync_pin != '' }}
        run: |
          set -euo pipefail
          sed "s|REPLACE_WITH_SYNC_PIN|${SYNC_PIN}|" \
            supabase/migrations/0006_sync_pin.sql > /tmp/sync_pin.sql
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/sync_pin.sql
        env:
          DB_URL: ${{ inputs.db_url }}
          SYNC_PIN: ${{ inputs.sync_pin }}

      - name: Fix pgcrypto search_path in sync functions (0007_fix_sync_pin_search_path.sql)
        run: |
          set -euo pipefail
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f supabase/migrations/0007_fix_sync_pin_search_path.sql
        env:
          DB_URL: ${{ inputs.db_url }}

      - name: Done
        run: echo "Supabase setup complete for ${{ inputs.login_email }}"
